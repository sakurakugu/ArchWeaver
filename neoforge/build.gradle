plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    java.srcDir project(':api').file('src/main/java')
    java.srcDir file('src/main/java')
    resources.srcDir project(':common').file('src/main/resources')
}

repositories {
    // 下面两个是 REI 的依赖
    maven {
        url = 'https://maven.shedaniel.me'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
        }
    }
    maven {
        url = 'https://maven.architectury.dev'
        content {
            includeGroup 'dev.architectury'
        }
    }
    // 这个是 JEI 的依赖（JEI的api）
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"
    // JEI 仅供兼容插件编译，安装与开发运行时均不强制携带。
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // REI API 含 NeoForge 客户端插件注解；同样只用于编译，不随模组发布。
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            programArgument '--username'
            programArgument 'Player1'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties values
    expand values
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
