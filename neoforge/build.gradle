plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    java.srcDir project(':api').file('src/main/java')
    java.srcDir file('src/main/java')
    resources.srcDir project(':common').file('src/main/resources')
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // 下面两个是 REI 的依赖
    // https://github.com/shedaniel/RoughlyEnoughItems
    maven {
        url = 'https://maven.shedaniel.me'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
        }
    }
    maven {
        url = 'https://maven.architectury.dev'
        content {
            includeGroup 'dev.architectury'
        }
    }
    // JEI 物品管理器
    // JourneyMap 旅行地图
    maven {
        url = 'https://maven.blamejared.com'
        content {
            // https://github.com/mezz/JustEnoughItems
            includeGroup 'mezz.jei'
            // https://github.com/TeamJM/journeymap-api
            // https://github.com/TeamJM/journeymap
            includeGroup 'info.journeymap'
        }
    }
}

configurations {
    xaeroMapJar { canBeConsumed = false; transitive = false }
}

// ------- Xaero 世界地图依赖处理 -------
// Xaero 把界面基类放在内嵌 XaeroLib 中；提取仅用于编译，发布包不携带第三方类。
abstract class ExtractXaeroLib extends DefaultTask {
    @InputFiles @Classpath abstract ConfigurableFileCollection getMapJars()
    @OutputFile abstract RegularFileProperty getLibraryJar()

    @TaskAction void extract() {
        def output = libraryJar.get().asFile
        output.parentFile.mkdirs()
        new java.util.zip.ZipFile(mapJars.singleFile).withCloseable { zip ->
            def entry = zip.entries().find { it.name.startsWith('META-INF/jarjar/xaerolib-') && it.name.endsWith('.jar') }
            if (entry == null) throw new GradleException('Xaero 世界地图缺少内嵌 XaeroLib')
            zip.getInputStream(entry).withCloseable { input -> output.withOutputStream { it << input } }
        }
    }
}

def extractXaeroLib = tasks.register('extractXaeroLib', ExtractXaeroLib) {
    mapJars.from(configurations.xaeroMapJar)
    libraryJar = layout.buildDirectory.file('xaero-compile/xaerolib.jar')
}
// -------------------------------------

dependencies {
    xaeroMapJar "maven.modrinth:xaeros-world-map:${xaero_world_map_version}"
    compileOnly files(configurations.xaeroMapJar)
    compileOnly files(extractXaeroLib.flatMap { it.libraryJar })
    if (providers.gradleProperty('xaeroMapDev').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly "maven.modrinth:xaeros-world-map:${xaero_world_map_version}"
    }
    compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    // JEI 仅供兼容插件编译，安装与开发运行时均不强制携带。
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // REI API 含 NeoForge 客户端插件注解；同样只用于编译，不随模组发布。
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            programArgument '--username'
            programArgument 'Player1'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties values
    expand values
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
