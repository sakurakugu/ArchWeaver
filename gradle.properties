org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.112

mod_id=archweaver
mod_name=ArchWeaver
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.sakurakugu.archweaver
jetbrains_annotations_version=26.0.2

# 适配 JEI，防止被 JEI 遮住内容
jei_version=29.43.0.106

# 适配 REI，复用界面的可见区域以避免遮挡。
rei_version=26.1.819

# 内容版（ArchWeaver: Artifice）——注册方块物品，硬依赖 core
artifice_mod_id=archweaver_artifice
artifice_mod_name=ArchWeaver Artifice
artifice_mod_version=1.0.0
# core 依赖范围写宽，避免 core 发补丁就要重发 addon
archweaver_dependency_range=[1.0,2.0)
