plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

allprojects {
    group = mod_group_id
    version = mod_version
}

subprojects {
    repositories {
        mavenCentral()
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(25)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}

def artifactMinecraftVersion = rootProject.property('minecraft_version')
def releaseVersion = rootProject.property('mod_version')

// 每个发布包一项：core 和内容版各自独立版本号。
def artifactSpecs = [
        [path: ':fabric', id: rootProject.property('mod_id'),
         version: rootProject.property('mod_version'), loader: 'fabric'],
        [path: ':artifice:fabric', id: rootProject.property('artifice_mod_id'),
         version: rootProject.property('artifice_mod_version'), loader: 'fabric'],
        [path: ':neoforge', id: rootProject.property('mod_id'),
         version: rootProject.property('mod_version')],
        [path: ':artifice:neoforge', id: rootProject.property('artifice_mod_id'),
         version: rootProject.property('artifice_mod_version')],
]

// 复制并重命名发布包
def copyBuildArtifacts = tasks.register('copyBuildArtifacts', Copy) {
    group = 'build'
    description = '复制并重命名 Fabric 和 NeoForge 发布包到根目录 build/v<版本>。'
    into layout.buildDirectory.dir("v${releaseVersion}")
    artifactSpecs.each { spec ->
        dependsOn "${spec.path}:build"
        from(project(spec.path).layout.buildDirectory.dir('libs')) {
            def loader = spec.loader ?: 'neoforge'
            include "${spec.id}-${artifactMinecraftVersion}-${loader}-${spec.version}.jar"
            rename { "${spec.id}-v${spec.version}-mc${artifactMinecraftVersion}-${loader}.jar" }
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = '构建 Fabric、NeoForge 模组与内容版。'
    dependsOn copyBuildArtifacts
}

tasks.register('build') {
    group = 'build'
    description = '构建并测试通用代码、Fabric、NeoForge 模组与内容版。'
    dependsOn ':common:test', copyBuildArtifacts
}
