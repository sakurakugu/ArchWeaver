pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'archweaver'
include 'common', 'api', 'neoforge', 'fabric', 'artifice:common', 'artifice:neoforge', 'artifice:fabric'
